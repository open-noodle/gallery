[project]
name = "petid"
version = "0.1.0"
description = "Pet re-ID model training (frozen DINOv2 + projection head)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.13",
    "torchvision>=0.18",
    "transformers>=5.0",
    "scikit-learn>=1.5",
    "pillow>=10.0",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "onnx>=1.16",
    "huggingface-hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
