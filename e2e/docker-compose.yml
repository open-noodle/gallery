name: immich-e2e

services:
  e2e-auth-server:
    container_name: immich-e2e-auth-server
    build:
      context: ../
      dockerfile: packages/e2e-auth-server/Dockerfile
    ports:
      - 2286:2286

  immich-server:
    container_name: immich-e2e-server
    image: immich-server:latest
    build:
      context: ../
      dockerfile: server/Dockerfile
      # Gallery (#171): no `cache_from`. Upstream points it at its own GHCR build cache, which the
      # fork must not read from — the tags 404 here, and if one ever resolves the fork's e2e image
      # would silently import upstream-built layers. Because this rule is expressed as a DELETION,
      # upstream re-adding the block produces no conflict and no gate notices: re-check it after a
      # rebase that touches this file.
      args:
        - BUILD_ID=1234567890
        - BUILD_IMAGE=e2e
        - BUILD_SOURCE_REF=e2e
        - BUILD_SOURCE_COMMIT=e2eeeeeeeeeeeeeeeeee
      # Gallery: the plugins stage fetches js-pdk from GitHub. Unauthenticated that is 60 requests/hour
      # per runner IP, which intermittently 403s and surfaces as `extism-js: not found`. test.yml already
      # exports GITHUB_TOKEN for this build; forward it so the fetch is authenticated.
      secrets:
        - github_token
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      IMMICH_TELEMETRY_INCLUDE: all
      IMMICH_ENV: testing
      IMMICH_PORT: '2285'
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: 'true'
    volumes:
      - ./test-assets:/test-assets
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - 2285:2285

  redis:
    container_name: immich-e2e-redis
    image: ghcr.io/valkey-io/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich-e2e-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    ports:
      - 5435:5432
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s

secrets:
  github_token:
    environment: GITHUB_TOKEN
