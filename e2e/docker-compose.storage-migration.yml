services:
  minio:
    container_name: immich-e2e-minio
    # MinIO withdrew its own images from quay.io and Docker Hub on 2026-09-24. Chainguard's build
    # is current and still ships `mc`, which the tests exec into this container. Its free tier only
    # publishes `latest`, so pin the index digest to keep runs reproducible.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets the healthcheck's `mc ready local` reach the server without a prior `mc alias set`.
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      # The Chainguard image has no curl.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  immich-server:
    volumes:
      - upload-data:/usr/src/app/upload
    environment:
      IMMICH_STORAGE_BACKEND: ${IMMICH_STORAGE_BACKEND:-disk}
      IMMICH_S3_BUCKET: immich-test
      IMMICH_S3_ENDPOINT: http://minio:9000
      IMMICH_S3_ACCESS_KEY_ID: minioadmin
      IMMICH_S3_SECRET_ACCESS_KEY: minioadmin
      IMMICH_S3_REGION: us-east-1
      IMMICH_S3_SERVE_MODE: proxy
    depends_on:
      minio:
        condition: service_healthy

volumes:
  upload-data:
