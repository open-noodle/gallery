ci_invariants:
  - id: no-push-o-matic
    title: No upstream PUSH_O_MATIC token dependency
    forbidden_patterns: [PUSH_O_MATIC, create-workflow-token]
    paths: [.github/workflows/**/*.yml, .github/workflows/**/*.yaml]
    exceptions:
      - .github/workflows/merge-translations.yml
  - id: gallery-release-image-names
    title: Gallery release workflows publish Gallery images
    forbidden_patterns:
      - ghcr.io/immich-app/immich-server
      - ghcr.io/immich-app/immich-web
      - ghcr.io/immich-app/immich-machine-learning
    paths: [.github/workflows/gallery-*.yml]
    exceptions: [.github/workflows/gallery-revert-to-immich-validation.yml]
  - id: gallery-docs-deploy-disabled-upstream
    title: Upstream docs deploy stays workflow_dispatch only
    forbidden_patterns: ['workflow_run:']
    paths: [.github/workflows/docs-deploy.yml]
    exceptions: []
  # Option M: a person_group holds exactly one person row — the owner's. Upstream filters its person
  # joins to the VIEWER's row, which is meaningful with cluster groups on and a silent nullifier here:
  # every non-owner gets `person: null` on faces they may see, and hidden people stop being hidden.
  # Both joins must prefer the viewer and fall back, never filter. See
  # specs/2026-08-22-option-m-invariant-inventory.md §2.
  #
  # Scope, so this is not over-trusted: it is a substring check over the listed files. It catches the
  # two literal forms upstream has actually reintroduced, and nothing else — not a renamed variable,
  # not an eb(...)/whereRef spelling, and not the removal of the prefer-the-viewer ORDER BY / LIMIT 1
  # that makes the join deterministic. Those are covered by the medium specs
  # (person.service.spec.ts "non-owner read access", asset.service.spec.ts shared-album recipient),
  # which are the real gate; this invariant is a cheap tripwire on top of them.
  - id: person-join-not-viewer-filtered
    title: Person joins prefer the viewer's row, never filter to it
    forbidden_patterns:
      - "'person.ownerId', '=', viewingUserId"
      - "'person.ownerId', '=', asUuid(viewingUserId)"
    paths:
      - server/src/repositories/person.repository.ts
      - server/src/utils/database.ts
      # Carries a person join of its own (the memory-asset query). Its filter is the MEMORY owner,
      # not the viewer, so it is correct today — listed so a future edit toward the viewer form is
      # caught rather than silently uncovered.
      - server/src/repositories/asset.repository.ts
    exceptions: []

  # immich-30179 dispatches the four search endpoints to the dormant V3 builder whenever the request
  # carries the structured shape. Gallery deliberately stays on searchAssetBuilderLegacy — V3 has no
  # shared-space arm and drops the ownership predicate on album-confined branches — and rejects the
  # new shape instead of falling through (legacy ignores `filter`, so a fallthrough would silently
  # return a WIDER set than asked for). A rebase that resolves search.service.ts toward upstream
  # would re-enable V3 with no conflict and no test failure; this catches that.
  # Adopting V3 is a deliberate project: delete this invariant in the same change.
  - id: search-v3-not-dispatched
    title: Search V3 stays dormant; the flat path keeps the shared-space gate
    forbidden_patterns:
      - 'return this.searchMetadataV3(auth, dto);'
      - 'return this.searchStatisticsV3(auth, dto);'
      - 'return this.searchRandomV3(auth, dto);'
      - 'return this.searchSmartV3(auth, dto);'
    paths:
      - server/src/services/search.service.ts
    exceptions: []

patches:
  - id: immich-ui-command-patch
    package: '@immich/ui'
    version_source: pnpm-workspace.yaml
    expected_patch: patches/@immich__ui@0.86.0.patch
    required_check: fork-patches-check

risk_patterns:
