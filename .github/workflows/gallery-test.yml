# Gallery's own CI jobs, kept out of upstream's test.yml so that file differs from the upstream tag
# only by the infrastructure substitutions (app token, runners, the e2e runner fixes). Same triggers
# and concurrency as test.yml; a change to either file forces every job here, as it did when these
# jobs lived in test.yml. The rolling rebase branch gets no push CI: dispatch both workflows.
name: Gallery Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pre-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check what should run
        id: check
        uses: immich-app/devtools/actions/pre-job@75493d49052d536863fc96100086782c5279b145 # pre-job-action-v2.1.1
        with:
          github-token: ${{ github.token }}
          filters: |
            i18n:
              - 'i18n/**'
              - 'mise.toml'
            ml-training:
              - 'machine-learning/pet-recognition-training/**'
              - 'machine-learning/mise.toml'
              - 'mise.toml'
            upstream-preflight:
              # every workflow file: the ci-invariants step scans all of .github/workflows
              - '.github/workflows/**'
              - 'tools/upstream-preflight/**'
              - 'docs/fork/ownership.yml'
              - 'docs/docs/developer/upstream-rebase-process.md'
              - 'docs/docs/developer/fork-surface-guidelines.md'
              - 'Makefile'
              # Everything below is READ BY the preflight specs. Without these the job is SKIPPED on a
              # PR that breaks a fork invariant in that source or drops a migration ledger rename --
              # and a skipped job is indistinguishable from a passing one. Keep in sync with the
              # `path.resolve(process.cwd(), '../../...')` targets in tools/upstream-preflight/src/**.
              - 'web/src/**'
              - 'mobile/lib/**'
              - 'server/src/schema/gallery-migration-ledger.ts'
              - 'server/src/schema/migrations/**'
              - 'server/src/schema/migrations-gallery/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'branding/scripts/gallery-branding-check.sh'
              - 'machine-learning/scripts/gallery-ml-smoke.sh'
              # fork-deletions.spec.ts asserts paths the fork deleted on purpose stay deleted, so the
              # job has to run on a PR that resurrects one (web/src and mobile/lib are listed above).
              - 'packages/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/pull_request_template.md'
              - 'design/**'
              - 'misc/**'
              - 'mobile/android/app/src/main/res/drawable/**'
              - 'mobile/integration_test/**'
              - 'server/test/medium/specs/repositories/**'
            .github:
              - '.github/**'
          force-filters: |
            - '.github/workflows/test.yml'
            - '.github/workflows/gallery-test.yml'
          force-events: 'workflow_dispatch'

  upstream-preflight:
    name: Upstream Rebase Tooling
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).upstream-preflight == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm' # zizmor: ignore[cache-poisoning] release branches cannot read caches written by pull requests
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: SHARP_IGNORE_GLOBAL_LIBVIPS=true pnpm install --frozen-lockfile

      - name: Run upstream-preflight tests
        run: pnpm --filter @gallery/upstream-preflight run test

      # The fork's own CI invariants (no upstream-only app-token dependency, Gallery release image
      # names, upstream docs-deploy stays dispatch-only, person joins prefer the viewer's row) were
      # run by NO workflow -- they fired only when a human typed `make ci-invariants-check`. An
      # invariant nobody runs is a comment.
      # (Careful: the token invariant forbids its own literal token name in any workflow file, so do
      # not spell it out here -- this comment tripped that gate once already.)
      - name: Run fork CI invariant audits
        run: pnpm --filter @gallery/upstream-preflight run ci-invariants-check

      - name: Run upstream-preflight type check
        run: pnpm --filter @gallery/upstream-preflight run check

      - name: Run upstream-preflight format check
        run: pnpm --filter @gallery/upstream-preflight run format

  # Behavioural gate for the branding pipeline. ShellCheck only lints these
  # scripts; nothing in CI ran patch_i18n() and asserted what it produces, which
  # is how the delete-and-fall-back-to-English behaviour behind issue #844 went
  # unnoticed. Only test-i18n-branding.sh was ever wired up; the other five
  # branding scripts ran in no workflow at all.
  #
  # This runs branding/scripts/gallery-branding-check.sh, the umbrella gate: it
  # creates a throwaway detached worktree at HEAD, runs every branding
  # regression test (email, app-download, i18n, oauth-callback), then applies the
  # full branding overlay and verifies the result. It never mutates the checkout
  # and asserts as much on exit. ~14s end to end, and it works on the shallow
  # clone actions/checkout produces.
  #
  # It is deliberately NOT gated on a path filter. apply-branding rewrites SOURCE
  # files (web/, server/, mobile/), so what breaks it is usually an edit to a file
  # it patches, not to branding/ itself. Upstream #30527 is the worked example: it
  # moved the app-download store URLs out of AppDownloadModal.svelte into
  # @immich/ui `Constants`, turning apply-branding's literal-URL rewrites into
  # silent no-ops so a branded build shipped upstream's Play/App Store links. It
  # touched only web/, so the old `branding/**` filter would have skipped this job
  # precisely when it was needed. At ~14s, always running it is cheaper than
  # trying to enumerate which paths can invalidate branding.
  branding-tests:
    name: Test Branding
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          token: ${{ github.token }}

      # apply-branding resizes the Android 12 splash assets and verify-mobile-assets
      # measures icon bounds, both via ImageMagick. It is no longer preinstalled on
      # the ubuntu runner images, so install it explicitly rather than letting the
      # check fail with "ImageMagick convert or magick is required".
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Run branding pipeline checks
        run: ./branding/scripts/gallery-branding-check.sh

  i18n-overlay-tests:
    name: Test i18n Overlay
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).i18n == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Merge rule self-test, then overlay entries upstream now shadows and overrides.txt lines for keys upstream dropped.
      - name: Check Gallery overlay
        run: node --test i18n/gallery/merge.test.mjs && node i18n/gallery/merge.mjs --check

  ml-training-tests:
    name: Unit Test ML Training
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).ml-training == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./machine-learning
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ github.token }}

      - name: Run test-training
        run: mise run test-training

  github-files-tests:
    name: .github Files Tests
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run)['.github'] == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./.github
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        if: ${{ !cancelled() }}

  migration-order:
    name: Gallery Migration ORDER
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile

      # Duplicated from migration-order.yml on purpose. That workflow triggers on
      # `push: [main, release/*]` / `pull_request` only, so it never runs on the rolling rebase
      # branch, which sits off `main` for weeks at a time and is validated by dispatching this
      # workflow set (test.yml and this file). The manifest silently drifted there for a whole cycle
      # (six migrations missing, one stale entry) because no dispatched workflow checked it. This
      # step needs no DB and no build, so it fails fast and cannot be forgotten. Consistency only -- the append-only
      # invariant still lives in migration-order.yml, which has the base-commit baseline.
      - name: Verify Gallery migration ORDER
        run: pnpm --filter immich migrations:verify-order:gallery
