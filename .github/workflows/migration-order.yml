name: Migration Order

on:
  # Fork addition: the rolling rebase branch sits off `main` for long stretches, so without a
  # manual trigger this gate would never run there. Upstream has no equivalent need.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  migration-order:
    name: Verify migration ORDER
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      BASELINE: ${{ github.workspace }}/base/server/src/schema/migrations/ORDER
      MAIN_MIGRATIONS: ${{ github.workspace }}/main/server/src/schema/migrations
      ORDER: ${{ github.workspace }}/server/src/schema/migrations/ORDER
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `github.event.before` exists only on a `push` payload. On `workflow_dispatch` -- the only
      # mode a branch sitting off `main` can use, and the reason the fork added that trigger at all --
      # it renders EMPTY, and `actions/checkout` with an empty `ref` silently falls back to the
      # TRIGGERING ref. `base/` then becomes a copy of the branch itself and
      # `verify-order --append-only-from` compares ORDER against itself: trivially satisfied, no
      # notice printed, invariant not enforced. Skip the checkout instead and let the
      # `[ -f "${BASELINE}" ]` guard below degrade to the consistency check with a visible notice.
      # The all-zeros SHA is a branch's first push, which has no base to compare against either.
      - name: Checkout base
        if: ${{ env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: mise //server:install

      # Upstream's migrations/ folder keeps upstream's append-only invariant: the fork never adds
      # files there, so a violation means a rebase dropped or reordered an upstream migration.
      - name: Verify migration ORDER
        # The baseline is absent whenever the base commit predates the ORDER manifest -- notably the
        # `main` cutover push, where `github.event.before` is the pre-rebase main. Reading it
        # unconditionally would throw. Degrade to the consistency check in that case; the
        # append-only invariant resumes as soon as the base carries an ORDER file.
        run: |
          if [ -f "${BASELINE}" ]; then
            mise //server:migrations verify-order --append-only-from "${BASELINE}"
          else
            echo "::notice::No ORDER baseline at the base commit; checking consistency only."
            mise //server:migrations verify-order
          fi

      # The fork's own migrations-gallery/ folder is checked for consistency only, NOT append-only.
      # Gallery migrations use hand-picked round timestamps and the server runs with
      # allowUnorderedMigrations: true (see DatabaseRepository.createMigrator), so a feature branch
      # landing with a lower timestamp than one merged meanwhile is safe here — unlike upstream,
      # which only allows unordered migrations in dev. Consistency still forces two branches that
      # both add a gallery migration to conflict in git on ORDER's tail, which is the point.
      - name: Verify Gallery migration ORDER
        run: mise //server:migrations-gallery verify-order
