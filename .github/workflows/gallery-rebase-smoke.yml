name: Gallery Rebase Smoke

on:
  workflow_dispatch:

jobs:
  rebase-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # pnpm-workspace.yaml sets injectWorkspacePackages, so a plain `pnpm install`
      # COPIES @immich/sdk into e2e/node_modules. Build the SDK before that install
      # or the injected copy has no build/ output and the specs fail to import it.
      # Same build-before-inject ordering as test.yml and server/Dockerfile.
      - run: pnpm --filter @immich/sdk install --frozen-lockfile && pnpm --filter @immich/sdk build
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install chromium --only-shell
      - name: Start e2e stack
        working-directory: e2e
        # The plugins stage fetches js-pdk from GitHub; unauthenticated that is 60 requests/hour per
        # runner IP and 403s surface as `extism-js: not found`. e2e/docker-compose.yml forwards this
        # as the github_token build secret, but only if the workflow exports it — same as test.yml.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker compose up -d --build --wait
      - name: Run rebase-smoke project
        working-directory: e2e
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: 'true'
        run: pnpm exec playwright test --project=rebase-smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Teardown
        if: always()
        working-directory: e2e
        run: docker compose down -v
