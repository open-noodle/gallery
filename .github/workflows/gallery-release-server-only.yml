name: Release Gallery Server

# The server release. Builds + pushes the server and ML Docker images,
# moves the floating git tags, creates the GitHub Release, and flips the
# version endpoint that self-hosted instances poll.
#
# Mobile is released independently via "Release Mobile" — the two no
# longer hand off through a draft release. To ship a server build that
# matches a mobile release, pass the same `version` and the `commit` SHA
# that the mobile run recorded in its summary.
#
# See docs/plans/2026-05-18-decoupled-release-design.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v4.56.6)'
        required: true
        type: string
      commit:
        description: 'Commit SHA to release up to (default: HEAD of the triggering branch). Pass the SHA the mobile run recorded to ship a matching server build.'
        required: false
        type: string
      build_ml_rocm:
        description: 'Build & publish the ROCm ML image (gallery-ml:*-rocm) on the self-hosted `gallery-rocm` runner. Uncheck to skip (e.g. runner offline) — the core release is never blocked by it.'
        required: false
        type: boolean
        default: true

concurrency:
  group: gallery-release-server
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    name: Validate branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main or release branch
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != "main" && "$REF" != release/* ]]; then
            echo "::error::Releases must be triggered from main or release/* (got: $REF)"
            exit 1
          fi
          echo "Branch $REF OK."

  version:
    name: Resolve version & commit
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$INPUT_VERSION' (expected v<major>.<minor>.<patch>, e.g. v4.56.6)"
            exit 1
          fi

          sha="$DEFAULT_SHA"
          if [[ -n "$INPUT_COMMIT" ]]; then
            # Resolve to a full commit SHA and require it to be an ancestor
            # of the triggering ref, so we only ever release a commit that
            # is already merged onto this branch — never an arbitrary or
            # unmerged commit. This is the "release up to <commit>" pin.
            if ! sha=$(git rev-parse --verify --quiet "${INPUT_COMMIT}^{commit}"); then
              echo "::error::commit '$INPUT_COMMIT' not found in history"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" "$DEFAULT_SHA"; then
              echo "::error::commit '$sha' is not an ancestor of ${DEFAULT_SHA} — refusing to release a commit not merged on this branch"
              exit 1
            fi
          fi

          major=$(echo "$INPUT_VERSION" | sed 's/^v//' | cut -d. -f1)
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=v${major}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $INPUT_VERSION from $sha"

  build-server:
    name: Build Server (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        uses: ./.github/actions/apply-branding
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Prepare platform pair
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "platform-pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_REF=${{ needs.version.outputs.version }}
            BUILD_SOURCE_COMMIT=${{ needs.version.outputs.sha }}
          outputs: type=image,"name=ghcr.io/open-noodle/gallery-server",push-by-digest=true,name-resolution=short,push=true
          cache-from: type=gha,scope=server-${{ steps.prepare.outputs.platform-pair }}
          cache-to: type=gha,scope=server-${{ steps.prepare.outputs.platform-pair }},mode=max

      - name: Export digest
        run: | # zizmor: ignore[template-injection]
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: server-digests-${{ steps.prepare.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-server:
    name: Merge Server Manifest
    needs: [version, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/open-noodle/gallery-server
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
        run: |
          tags="-t ${IMAGE}:${VERSION} -t ${IMAGE}:${MAJOR} -t ${IMAGE}:release"
          sources=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create ${tags} ${sources}

  build-ml:
    name: Build ML ${{ matrix.device }} (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            platform: linux/amd64
            runner: ubuntu-latest
          - device: cpu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - device: cuda
            platform: linux/amd64
            runner: ubuntu-latest
          - device: openvino
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        uses: ./.github/actions/apply-branding
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Prepare platform pair
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "platform-pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEVICE=${{ matrix.device }}
          outputs: type=image,"name=ghcr.io/open-noodle/gallery-ml",push-by-digest=true,name-resolution=short,push=true
          cache-from: type=gha,scope=ml-${{ matrix.device }}-${{ steps.prepare.outputs.platform-pair }}
          cache-to: type=gha,scope=ml-${{ matrix.device }}-${{ steps.prepare.outputs.platform-pair }},mode=max

      - name: Export digest
        run: | # zizmor: ignore[template-injection]
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ml-${{ matrix.device }}-digests-${{ steps.prepare.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ml:
    name: Merge ML Manifest (${{ matrix.device }})
    needs: [version, build-ml]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - device: cpu
            suffix: ''
          - device: cuda
            suffix: '-cuda'
          - device: openvino
            suffix: '-openvino'
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: ml-${{ matrix.device }}-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/open-noodle/gallery-ml
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          tags="-t ${IMAGE}:${VERSION}${SUFFIX} -t ${IMAGE}:${MAJOR}${SUFFIX} -t ${IMAGE}:release${SUFFIX}"
          sources=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create ${tags} ${sources}

  # ── Fork-only: ROCm ML image (self-hosted builder) ──────────────────────
  # The ROCm image (rocm/dev-ubuntu-24.04:*-complete base, ~40GB) does not fit
  # a GitHub-hosted runner's disk, so it builds on the self-hosted `gallery-rocm`
  # runner. These two jobs are DECOUPLED from `tag` on purpose: a ROCm failure
  # or an offline runner never blocks the core release. Uncheck the
  # `build_ml_rocm` dispatch input to skip them entirely.
  build-ml-rocm:
    name: Build ML rocm (linux/amd64)
    if: ${{ inputs.build_ml_rocm }}
    needs: version
    runs-on: gallery-rocm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        uses: ./.github/actions/apply-branding
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: linux/amd64
          build-args: |
            DEVICE=rocm
          outputs: type=image,"name=ghcr.io/open-noodle/gallery-ml",push-by-digest=true,name-resolution=short,push=true
          cache-from: type=gha,scope=ml-rocm-linux-amd64
          cache-to: type=gha,scope=ml-rocm-linux-amd64,mode=max

      - name: Export digest
        run: | # zizmor: ignore[template-injection]
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ml-rocm-digests-linux-amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ml-rocm:
    name: Merge ML Manifest (rocm)
    if: ${{ inputs.build_ml_rocm }}
    needs: [version, build-ml-rocm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: ml-rocm-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/open-noodle/gallery-ml
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          SUFFIX: '-rocm'
        run: |
          tags="-t ${IMAGE}:${VERSION}${SUFFIX} -t ${IMAGE}:${MAJOR}${SUFFIX} -t ${IMAGE}:release${SUFFIX}"
          sources=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create ${tags} ${sources}

  tag:
    name: Create Git Tag and GitHub Release
    needs: [version, merge-server, merge-ml]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.version.outputs.sha }}

      - name: Create tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          major=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1)

          # -f on all three makes re-runs idempotent if a prior attempt
          # pushed the tag before failing downstream.
          git tag -f "$VERSION" "$SHA"
          git tag -f "v${major}" "$SHA"
          git tag -f "release" "$SHA"

          git push origin "$VERSION" "v${major}" "release" --force

      - name: Sync example.env to release major
        env:
          MAJOR: ${{ needs.version.outputs.major }}
        run: |
          # example.env is attached to the release below and is what the install
          # docs' releases/latest/download/example.env link serves. It pins
          # IMMICH_VERSION to the major rolling tag (e.g. v5). Rewrite it to this
          # release's major so the attached asset never lags a major bump, even
          # if the committed docker/example.env wasn't bumped for this release.
          sed -i "s/^IMMICH_VERSION=.*/IMMICH_VERSION=${MAJOR}/" docker/example.env
          grep '^IMMICH_VERSION=' docker/example.env

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          upstream_version=$(jq -r '.upstream.version' branding/config.json)

          # Find the most recent previous release for the APK link. We just
          # pushed $VERSION, so skip it in the sorted list.
          prev_tag=$(git tag --list 'v*.*.*' --sort=-version:refname | grep -Fvx "$VERSION" | head -n1)

          notes="Based on [Immich v${upstream_version}](https://github.com/immich-app/immich/releases/tag/v${upstream_version})"

          if [[ -n "$prev_tag" ]]; then
            # Upstream stamps each of its own releases with a `chore: version vX.Y.Z`
            # commit; the most recent one reachable from a ref is that release's
            # upstream base, and everything above it is fork work. Diffing the two
            # bases rather than the raw prev_tag..SHA range is what keeps an upstream
            # rebase — which rewrites every fork commit's SHA — from re-listing fork
            # commits that already shipped in the previous release.
            base_new=$(git log --format=%H --grep='^chore: version v' -1 "$SHA" || true)
            base_old=$(git log --format=%H --grep='^chore: version v' -1 "$prev_tag" || true)

            if [[ -n "$base_new" && -n "$base_old" ]]; then
              shipped=$(mktemp)
              git log --pretty=format:'%s' "${base_old}..${prev_tag}" > "$shipped"
              if [[ -s "$shipped" ]]; then
                gallery_all=$(git log --pretty=format:'%s' "${base_new}..${SHA}" | grep -Fxv -f "$shipped" || true)
              else
                gallery_all=$(git log --pretty=format:'%s' "${base_new}..${SHA}" || true)
              fi
              rm -f "$shipped"

              upstream_commits=$(git log --pretty=format:'- %s' "${base_old}..${base_new}" || true)
            else
              # Fallback if upstream ever changes its release-commit convention:
              # split the raw range by PR number (fork PRs < 1000, upstream >= 1000).
              all_commits=$(git log --pretty=format:'%s' "${prev_tag}..${SHA}")
              gallery_all=$(echo "$all_commits" | awk '{ if (match($0, /\(#[0-9]+\)/)) { n = substr($0, RSTART+2, RLENGTH-3) + 0; if (n >= 1000) next } print }')
              upstream_commits=$(echo "$all_commits" | awk '{ if (match($0, /\(#[0-9]+\)/)) { n = substr($0, RSTART+2, RLENGTH-3) + 0; if (n >= 1000) print "- " $0 } }')
            fi

            # A commit reverted within the same range never shipped — drop both it
            # and its revert, so we never advertise a feature that isn't in the build.
            gallery_all=$(echo "$gallery_all" | awk '
              { lines[NR] = $0
                if (match($0, /^Revert "/)) {
                  inner = substr($0, 9, length($0) - 9)
                  reverted[inner] = 1
                  skip[NR] = 1
                }
              }
              END { for (i = 1; i <= NR; i++) if (!skip[i] && !(lines[i] in reverted)) print lines[i] }
            ')

            highlights=$(echo "$gallery_all" | grep -E '^(feat|fix|perf)' | sed 's/^/- /' || true)
            other=$(echo "$gallery_all" | grep -vE '^(feat|fix|perf)' | sed 's/^/- /' || true)

            # Gallery's own changes lead; upstream's go in a collapsed section.
            if [[ -n "$highlights" ]]; then
              printf -v notes '%s\n\n## Gallery changes\n\n%s' "$notes" "$highlights"
            fi
            if [[ -n "$other" ]]; then
              printf -v notes '%s\n\n<details>\n<summary>Other Gallery changes</summary>\n\n%s\n\n</details>' "$notes" "$other"
            fi
            if [[ -n "$upstream_commits" ]]; then
              printf -v notes '%s\n\n<details>\n<summary>Upstream commits</summary>\n\n%s\n\n</details>' "$notes" "$upstream_commits"
            fi
          fi

          gh release create "$VERSION" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$VERSION" \
            --latest \
            --notes "$notes" \
            docker/docker-compose.yml \
            docker/example.env

          echo "Released $VERSION from $SHA"

  publish-version-endpoint:
    name: Publish Version Endpoint
    needs: [version, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish version.json to Bunny
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STORAGE_HOST: ${{ vars.NOODLEGALLERY_VERSION_STORAGE_HOST }}
          STORAGE_ZONE: ${{ vars.NOODLEGALLERY_VERSION_STORAGE_ZONE_NAME }}
          STORAGE_PW: ${{ secrets.NOODLEGALLERY_VERSION_STORAGE_PASSWORD }}
          PULLZONE_ID: ${{ vars.NOODLEGALLERY_VERSION_PULLZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag: $VERSION"
            exit 1
          fi

          published_at=""
          for attempt in 1 2 3; do
            published_at=$(gh release view "$VERSION" --repo "$REPO" --json publishedAt --jq .publishedAt 2>/dev/null || true)
            if [[ -n "$published_at" && "$published_at" != "null" ]]; then
              break
            fi
            echo "Attempt ${attempt}: could not read publishedAt, retrying in 5s..."
            sleep 5
          done
          if [[ -z "$published_at" || "$published_at" == "null" ]]; then
            echo "::error::Could not read publishedAt for release $VERSION after 3 attempts"
            exit 1
          fi

          printf '{"version":"%s","published_at":"%s"}' "$VERSION" "$published_at" > /tmp/gallery

          # The version pull zone serves /gallery with edge rules forcing
          # Content-Type: application/json; charset=utf-8, CORS, and max-age=300,
          # so the stored object's content-type is irrelevant.
          curl -fsS -X PUT "https://$STORAGE_HOST/$STORAGE_ZONE/gallery" \
            -H "AccessKey: $STORAGE_PW" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/gallery -w 'put %{http_code}\n'

          curl -fsS -X POST "https://api.bunny.net/pullzone/$PULLZONE_ID/purgeCache" \
            -H "AccessKey: $BUNNY_API_KEY" \
            -H "Content-Length: 0" -w 'purge %{http_code}\n'
