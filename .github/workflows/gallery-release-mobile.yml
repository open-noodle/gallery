name: Release Mobile

# Independent mobile release. Builds + signs the Android AAB/APK and the
# iOS IPA at the commit that dispatched this run, uploads the AAB to the
# Play Store internal track and the IPA to TestFlight, and keeps the APK
# as a workflow artifact.
#
# It does NOT create a GitHub Release or a git tag. The version is supplied
# manually and the commit SHA it built from is written to the run summary
# so a maintainer can — optionally — ship a matching server build by
# running "Release Gallery Server" with the same version and that SHA.
#
# See specs/2026-05-18-decoupled-release-design.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to stamp (e.g. v4.56.6)'
        required: true
        type: string

concurrency:
  group: gallery-release-mobile
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != "main" ]]; then
            echo "::error::Releases must be triggered from main (got: $REF)"
            exit 1
          fi

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$VERSION' (expected v<major>.<minor>.<patch>, e.g. v4.56.6)"
            exit 1
          fi
          echo "Version: $VERSION"

  build-mobile:
    name: Build Mobile
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/gallery-build-mobile.yml
    with:
      environment: production
      version: ${{ inputs.version }}
    secrets:
      KEY_JKS: ${{ secrets.KEY_JKS }}
      ALIAS: ${{ secrets.ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}

  record:
    name: Record built commit
    needs: build-mobile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write version and commit SHA to run summary
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Mobile release ${VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo ""
            echo "Android AAB uploaded to Play Store **internal**; iOS IPA submitted to **TestFlight**."
            echo "The signed APK is attached to this run as the \`gallery-apk\` artifact."
            echo ""
            echo "To ship a matching server build, run **Release Gallery Server** with:"
            echo ""
            echo "- **version:** \`${VERSION}\`"
            echo "- **commit:** \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Mobile ${VERSION} built from ${SHA}"
