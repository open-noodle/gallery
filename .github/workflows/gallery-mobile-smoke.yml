name: Gallery Mobile Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test. Defaults to the triggering ref.'
        required: false
        type: string
        default: ''

concurrency:
  group: gallery-mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  android-smoke:
    name: Android smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/apply-branding

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install mobile dependencies
        run: mise //mobile:install:ci

      - name: Install mobile UI package dependencies
        working-directory: ./mobile/packages/ui
        run: flutter pub get

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Analyze mobile code
        run: mise //mobile:analyze

      - name: Run mobile tests
        run: mise //mobile:test

      - name: Build unsigned Android APK
        working-directory: ./mobile
        # mobile/android/gradle.properties (upstream-owned, no fork drift) pairs
        # android.enableJetifier=true with org.gradle.jvmargs=-Xmx4096M and
        # org.gradle.parallel=true. The debug APK pulls all three arch-specific
        # Flutter engine jars, and jetifying them concurrently inside a 4 GB heap
        # OOMs depending on runner memory ("Java heap space" in JetifyTransform) —
        # non-deterministic, seen failing and passing on the same SHA. Override the
        # daemon heap here so upstream's gradle.properties stays byte-identical.
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g
        run: flutter build apk --debug
