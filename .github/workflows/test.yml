name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pre-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check what should run
        id: check
        uses: immich-app/devtools/actions/pre-job@75493d49052d536863fc96100086782c5279b145 # pre-job-action-v2.1.1
        with:
          github-token: ${{ github.token }}
          filters: |
            i18n:
              - 'i18n/**'
              - 'mise.toml'
            web:
              - 'web/**'
              - 'i18n/**'
              - 'packages/sdk/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            server:
              - 'server/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
              - 'packages/plugin-core/**'
              - 'packages/plugin-sdk/**'
              - 'packages/plugin-gallery/**'
            cli:
              - 'packages/cli/**'
              - 'packages/sdk/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            e2e:
              - 'e2e/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
              - 'packages/plugin-gallery/**'
            mobile:
              - 'mobile/**'
              - 'mise.toml'
            machine-learning:
              - 'machine-learning/**'
              - 'mise.toml'
            upstream-preflight:
              - '.github/workflows/test.yml'
              - 'tools/upstream-preflight/**'
              - 'docs/fork/ownership.yml'
              - 'docs/docs/developer/upstream-rebase-process.md'
              - 'docs/docs/developer/fork-surface-guidelines.md'
              - 'Makefile'
              # Everything below is READ BY the preflight specs. Without these the job is SKIPPED on a
              # PR that reverts the branded-spinner swap or drops the migration compatibility alias --
              # and a skipped job is indistinguishable from a passing one. Keep in sync with the
              # `path.resolve(process.cwd(), '../../...')` targets in tools/upstream-preflight/src/**.
              - 'web/src/**'
              - 'mobile/lib/**'
              - 'server/bin/sync-gallery-migrations.mjs'
              - 'server/src/schema/migrations/**'
              - 'server/src/schema/migrations-gallery/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'branding/scripts/gallery-branding-check.sh'
              - 'machine-learning/scripts/gallery-ml-smoke.sh'
              # fork-deletions.spec.ts asserts paths the fork deleted on purpose stay deleted, so the
              # job has to run on a PR that resurrects one.
              - 'packages/**'
            .github:
              - '.github/**'
          force-filters: |
            - '.github/workflows/test.yml'
          force-events: 'workflow_dispatch'

  upstream-preflight:
    name: Upstream Rebase Tooling
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).upstream-preflight == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: SHARP_IGNORE_GLOBAL_LIBVIPS=true pnpm install --frozen-lockfile

      - name: Run upstream-preflight tests
        run: pnpm --filter @gallery/upstream-preflight run test

      # The fork's own CI invariants (no upstream-only app-token dependency, Gallery release image
      # names, upstream docs-deploy stays dispatch-only, person joins prefer the viewer's row) were
      # run by NO workflow -- they fired only when a human typed `make ci-invariants-check`. An
      # invariant nobody runs is a comment.
      # (Careful: the token invariant forbids its own literal token name in any workflow file, so do
      # not spell it out here -- this comment tripped that gate once already.)
      - name: Run fork CI invariant audits
        run: pnpm --filter @gallery/upstream-preflight run ci-invariants-check

      - name: Run upstream-preflight type check
        run: pnpm --filter @gallery/upstream-preflight run check

      - name: Run upstream-preflight format check
        run: pnpm --filter @gallery/upstream-preflight run format

  server-unit-tests:
    name: Test & Lint Server
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).server == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run //server:ci-unit

  cli-unit-tests:
    name: Unit Test CLI
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).cli == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run ci-unit

  cli-unit-tests-win:
    name: Unit Test CLI (Windows)
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).cli == true }}
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run setup @immich/sdk
        run: mise run //:sdk:install && mise run //:sdk:build
        working-directory: .

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      # Skip linter & formatter in Windows test.

      - name: Run tsc
        run: pnpm check
        if: ${{ !cancelled() }}

      - name: Run unit tests & coverage
        run: pnpm test
        if: ${{ !cancelled() }}

  web-lint:
    name: Lint Web
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).web == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run setup @immich/sdk
        run: mise run //:sdk:install && mise run //:sdk:build

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint
        if: ${{ !cancelled() }}

  web-unit-tests:
    name: Test Web
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).web == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run ci-unit

  # Behavioural gate for the branding pipeline. ShellCheck only lints these
  # scripts; nothing in CI ran patch_i18n() and asserted what it produces, which
  # is how the delete-and-fall-back-to-English behaviour behind issue #844 went
  # unnoticed. Only test-i18n-branding.sh was ever wired up; the other five
  # branding scripts ran in no workflow at all.
  #
  # This runs branding/scripts/gallery-branding-check.sh, the umbrella gate: it
  # creates a throwaway detached worktree at HEAD, runs every branding
  # regression test (email, app-download, i18n, oauth-callback), then applies the
  # full branding overlay and verifies the result. It never mutates the checkout
  # and asserts as much on exit. ~14s end to end, and it works on the shallow
  # clone actions/checkout produces.
  #
  # It is deliberately NOT gated on a path filter. apply-branding rewrites SOURCE
  # files (web/, server/, mobile/), so what breaks it is usually an edit to a file
  # it patches, not to branding/ itself. Upstream #30527 is the worked example: it
  # moved the app-download store URLs out of AppDownloadModal.svelte into
  # @immich/ui `Constants`, turning apply-branding's literal-URL rewrites into
  # silent no-ops so a branded build shipped upstream's Play/App Store links. It
  # touched only web/, so the old `branding/**` filter would have skipped this job
  # precisely when it was needed. At ~14s, always running it is cheaper than
  # trying to enumerate which paths can invalidate branding.
  branding-tests:
    name: Test Branding
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          token: ${{ github.token }}

      # apply-branding resizes the Android 12 splash assets and verify-mobile-assets
      # measures icon bounds, both via ImageMagick. It is no longer preinstalled on
      # the ubuntu runner images, so install it explicitly rather than letting the
      # check fail with "ImageMagick convert or magick is required".
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Run branding pipeline checks
        run: ./branding/scripts/gallery-branding-check.sh

  i18n-tests:
    name: Test i18n
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).i18n == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Format
        run: pnpm format:fix

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: |
            i18n/**

      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: i18n files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          exit 1

  e2e-tests-lint:
    name: End-to-End Lint
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).e2e == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run ci-unit
        if: ${{ !cancelled() }}

  server-medium-tests:
    name: Medium Tests (Server)
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).server == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-medium
        run: mise run ci-medium
        if: ${{ !cancelled() }}

  e2e-tests-server-cli:
    name: End-to-End Tests (Server & CLI)
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).e2e == true || fromJSON(needs.pre-job.outputs.should_run).server == true || fromJSON(needs.pre-job.outputs.should_run).cli == true }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup packages
        run: pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile && pnpm --filter @immich/sdk --filter @immich/cli build
        working-directory: .

      - name: Run setup web
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync
        working-directory: ./web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Free disk space
        working-directory: ./
        # The job builds the full server + ML images and loads the geodata (geonames)
        # dataset into Postgres on the same runner. On a runner image that ships with
        # little free disk, Postgres fails the geodata_places primary-key build with
        # "No space left on device" and the server never boots. Reclaim the preinstalled
        # toolchains we don't use before the build. Paths are absolute and missing paths
        # are ignored, so this is safe on both the x86 and arm runners.
        # Runs before the buildx/cache setup below so the image prune cannot discard it.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Start Docker Compose
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
      - name: Wait for e2e server
        run: node ../.github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping
      - name: Run e2e tests (api & cli)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test
      - name: Run e2e tests (maintenance)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test:maintenance
      - name: Capture Docker diagnostics
        if: always()
        run: |
          docker compose ps -a > docker-compose-ps.txt || true
          docker inspect immich-e2e-server immich-e2e-auth-server immich-e2e-postgres immich-e2e-redis > docker-inspect.json 2> docker-inspect.err || true
          node ../.github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping > e2e-server-final-ping.txt 2>&1 || true
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt 2>&1 || true
        working-directory: ./e2e

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-server-docker-logs-${{ matrix.runner }}
          path: |
            e2e/docker-compose-logs.txt
            e2e/docker-compose-ps.txt
            e2e/docker-inspect.json
            e2e/docker-inspect.err
            e2e/e2e-server-final-ping.txt
  e2e-tests-web:
    name: End-to-End Tests (Web)
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).e2e == true || fromJSON(needs.pre-job.outputs.should_run).web == true }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    strategy:
      matrix:
        # ARM runner disabled — Playwright tests are architecture-independent
        # and the ARM runner causes frequent timeouts on timing-sensitive UI tests.
        # To re-enable: runner: [ubuntu-latest, ubuntu-24.04-arm]
        runner: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Run setup @immich/sdk
        run: pnpm --filter @immich/sdk install --frozen-lockfile && pnpm --filter @immich/sdk build
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --only-shell
      - name: Free disk space
        working-directory: ./
        # Same as the server & cli e2e job: the full server + ML image build plus the
        # geodata (geonames) import into Postgres exhaust a tight runner's disk, crashing
        # the server on boot ("No space left on device"). Reclaim unused toolchains first.
        # Paths are absolute and missing paths are ignored, so this is safe on all runners.
        # Runs before the buildx/cache setup below so the image prune cannot discard it.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Docker build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
      - name: Wait for e2e server
        run: node ../.github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping
      - name: Run e2e tests (web)
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        run: pnpm test:web
      - name: Archive e2e test (web) results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: e2e-web-test-results-${{ matrix.runner }}
          path: e2e/playwright-report/

      - name: Run ui tests (web)
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        run: pnpm test:web:ui
      - name: Archive ui test (web) results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: e2e-ui-test-results-${{ matrix.runner }}
          path: e2e/playwright-report/

      - name: Run maintenance tests
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        run: pnpm test:web:maintenance
      - name: Archive maintenance tests (web) results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: e2e-maintenance-isolated-test-results-${{ matrix.runner }}
          path: e2e/playwright-report/
      - name: Capture Docker diagnostics
        if: always()
        run: |
          docker compose ps -a > docker-compose-ps.txt || true
          docker inspect immich-e2e-server immich-e2e-auth-server immich-e2e-postgres immich-e2e-redis > docker-inspect.json 2> docker-inspect.err || true
          node ../.github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping > e2e-server-final-ping.txt 2>&1 || true
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt 2>&1 || true
        working-directory: ./e2e

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-web-docker-logs-${{ matrix.runner }}
          path: |
            e2e/docker-compose-logs.txt
            e2e/docker-compose-ps.txt
            e2e/docker-inspect.json
            e2e/docker-inspect.err
            e2e/e2e-server-final-ping.txt
  success-check-e2e:
    name: End-to-End Tests Success
    needs: [e2e-tests-server-cli, e2e-tests-web]
    permissions: {}
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: immich-app/devtools/actions/success-check@81113db03f6d743efee81e0058c0b43f6cd6f36d # success-check-action-v0.0.6
        with:
          needs: ${{ toJSON(needs) }}
  mobile-unit-tests:
    name: Unit Test Mobile
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Run tests
        run: mise //mobile:test

  ml-unit-tests:
    name: Unit Test ML
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).machine-learning == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./machine-learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run ci-unit

  github-files-formatting:
    name: .github Files Formatting
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run)['.github'] == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./.github
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run formatter
        run: pnpm format
        if: ${{ !cancelled() }}
      - name: Run tests
        run: pnpm test
        if: ${{ !cancelled() }}
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          ignore_paths: >-
            **/open-api/** **/openapi** **/node_modules/**
  generated-api-up-to-date:
    name: OpenAPI Clients
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Install server dependencies
        run: pnpm --filter immich install --frozen-lockfile
      - name: Run API generation
        run: mise //:open-api
        working-directory: open-api

      # The generated Dart client only exists in this job (a plain ubuntu-latest
      # runner with no mise/Java/Flutter runs `dart-nullable-array-items.spec.ts`
      # everywhere else, so its `skipIf(!DART_MODEL_DIR)` guard would silently skip
      # forever there). Run it here, right after generation, so issue #743's
      # nullable-array-items invariant is actually exercised in CI.
      - name: Install upstream-preflight dependencies
        run: pnpm --filter @gallery/upstream-preflight install --frozen-lockfile
      # NOT `pnpm ... test <file>`: that package's `test` script is `vitest --run --passWithNoTests`,
      # so renaming or moving the spec would match nothing and exit 0 -- a check that cannot fail.
      # Invoke vitest directly so a vanished spec reddens the job.
      - name: Run dart nullable array items regression test
        run: pnpm --filter @gallery/upstream-preflight exec vitest --run dart-nullable-array-items.spec.ts

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: |
            packages/sdk
            open-api/immich-openapi-specs.json

      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          exit 1

  sql-schema-up-to-date:
    name: SQL Schema Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3@sha256:dbf18b3ffea4a81434c65b71e20d27203baf903a0275f4341e4c16dfd901fd67
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: immich
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugins
        run: mise //:plugins

      - name: Build the app
        run: mise //server:build

      - name: Run existing migrations
        run: pnpm --filter immich migrations:run

      - name: Test npm run schema:reset command works
        run: pnpm --filter immich schema:reset

      # `--filter` selects PACKAGES, not scripts. Upstream's `pnpm --filter migrations:generate ...`
      # matches no package (this one is named `immich`), so pnpm exited non-zero, `continue-on-error`
      # swallowed it, and the verify-changed-files step below saw no diff and passed. The gate was
      # inert. It is the only thing that catches a table definition drifting from what the migrations
      # actually produce -- during the option-M landing it was the sole detector of the face-review
      # tables still declaring `personId` with FKs to a deleted column while tsc sat at zero.
      # Keep the package name, and let a genuine failure go red.
      - name: Generate new migrations
        run: pnpm --filter immich migrations:generate src/TestMigration

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: |
            server/src

      - name: Verify migration files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated migration files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          cat ./server/src/*-TestMigration.ts
          exit 1

      - name: Run SQL generation
        run: mise //:sql
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/immich

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-sql-files
        with:
          files: |
            server/src/queries

      - name: Verify SQL files have not changed
        if: steps.verify-changed-sql-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-sql-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated SQL files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          git diff
          exit 1

