targets:
   $default:
     # Unimported upstream files kept byte-identical to cut rebase modify/delete stops; keeps search.page.dart's
     # @RoutePage out of router.gr.dart and its freezed part out of codegen. Same list in analysis_options.yaml.
     sources:
       exclude:
         - integration_test/module_login/login_input_validation_test.dart
         - integration_test/module_login/login_test.dart
         - integration_test/test_utils/general_helper.dart
         - integration_test/test_utils/login_helper.dart
         - lib/presentation/pages/search/paginated_search.provider.dart
         - lib/presentation/pages/search/search.page.dart
         - lib/providers/search/search_filter.provider.dart
         - lib/providers/search/search_input_focus.provider.dart
         - lib/widgets/search/search_filter/camera_picker.dart
         - lib/widgets/search/search_filter/common/dropdown.dart
         - lib/widgets/search/search_filter/display_option_picker.dart
         - lib/widgets/search/search_filter/filter_bottom_sheet_scaffold.dart
         - lib/widgets/search/search_filter/location_picker.dart
         - lib/widgets/search/search_filter/media_type_picker.dart
         - lib/widgets/search/search_filter/people_picker.dart
         - lib/widgets/search/search_filter/search_filter_chip.dart
         - lib/widgets/search/search_filter/search_filter_utils.dart
         - lib/widgets/search/search_filter/star_rating_picker.dart
     builders:
       #drift @DriftDatabase()
       drift_dev:
         # Disable default builder to use modular builder instead
         enabled: false
       drift_dev:analyzer:
         enabled: true
         options: &drift_options
           store_date_time_values_as_text: true
           named_parameters: true
           write_from_json_string_constructor: false
           data_class_to_companions: false
           # Required for make-migrations
           databases:
             main: lib/data/db/main/database.dart
         generate_for: &drift_generate_for
           - lib/data/db/**
           - lib/infrastructure/repositories/**
       drift_dev:modular:
         enabled: true
         options: *drift_options
         generate_for: *drift_generate_for